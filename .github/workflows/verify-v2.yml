name: V2 model-free acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-core:
    name: Windows core and frontend
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Install frozen Python dependencies
        run: python -m pip install -r requirements-acceptance.txt -r requirements-persistence.txt
      - name: Prepare pinned PostgreSQL for atomic budget tests
        run: python scripts/fetch_postgres.py
      - name: Verify core and frontend
        run: python -X utf8 scripts/verify_v2.py --scope core --output artifacts/ci/windows
      - name: Preserve setup or interrupted verification verdict
        if: always()
        run: python -c "from agentcheck_biz.ci.artifacts import ensure_report; ensure_report('artifacts/ci/windows/public','core')"
      - name: Publish verdicts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-verdicts
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/ci/windows/public/summary.json
            artifacts/ci/windows/public/report.md
            artifacts/ci/windows/public/junit.xml

  linux-integration:
    name: Linux container network and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build only allowlisted source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/export_v2_source.py --output "$RUNNER_TEMP/source.zip"
          python3 -m zipfile -e "$RUNNER_TEMP/source.zip" "$RUNNER_TEMP/v2-source"
          docker build --platform linux/amd64 -f "$RUNNER_TEMP/v2-source/ci/Dockerfile.v2" -t "agentcheck-v2:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$RUNNER_TEMP/v2-source"
      - name: Run disposable offline container
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker create --platform linux/amd64 --init --network none --cpus 2 --memory 4g --cap-drop ALL --security-opt no-new-privileges "agentcheck-v2:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker start "$container" >/dev/null
          code=$(docker wait "$container")
          mkdir -p artifacts/ci/linux/public
          docker cp "$container:/workspace/artifacts/ci/linux/public/." artifacts/ci/linux/public/
          cat artifacts/ci/linux/public/summary.json
          exit "$code"
      - name: Preserve setup or interrupted verification verdict
        if: always()
        run: python3 -c "from agentcheck_biz.ci.artifacts import ensure_report; ensure_report('artifacts/ci/linux/public','integration')"
      - name: Publish verdicts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-verdicts
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/ci/linux/public/summary.json
            artifacts/ci/linux/public/report.md
            artifacts/ci/linux/public/junit.xml
